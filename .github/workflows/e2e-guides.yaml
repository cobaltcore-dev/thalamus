name: Guides E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART_VERSION: 0.0.0-main
  DOCS_VERSION: main

jobs:
  guides:
    name: Guide (${{ matrix.slug }})
    runs-on: large_runner_16core_64gb
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: getting-started
            cluster: guides-gs
            timeout: 25
          - slug: open-webui
            cluster: guides-webui
            timeout: 30
          - slug: perses-dashboards
            cluster: guides-perses
            timeout: 40

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: ${{ matrix.cluster }}
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # --- perses-dashboards prerequisites (referenced, not spelled out, by the guide) ---
      # Go toolchain for the guide's own `go install percli` block.
      - name: Set up Go (perses job)
        if: matrix.slug == 'perses-dashboards'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # --- base stack + model: runs the getting-started guide itself ---
      - name: Run getting-started guide
        if: matrix.slug != 'getting-started'
        env:
          GUIDE: website/getting-started.md
          GUIDE_WORKDIR: /tmp/guide-work-base
          REPO_ROOT: ${{ github.workspace }}
          CHART_VERSION: ${{ env.CHART_VERSION }}
          DOCS_VERSION: ${{ env.DOCS_VERSION }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DRY_RUN: 'false'
        run: uv run test/e2e/run-guide.py

      # --- guide-specific serving infra (mirrors the guides' port-forward steps) ---
      # The open-webui guide enables the frontend listener itself; the forward
      # only needs to exist before its curl checks run (no assert here yet).
      - name: Port-forward WebUI frontend (open-webui job)
        if: matrix.slug == 'open-webui'
        run: |
          kubectl port-forward svc/inference-gateway 8081:8080 -n thalamus &
          sleep 3

      - name: Port-forward Prometheus + Perses (perses job)
        if: matrix.slug == 'perses-dashboards'
        env:
          PERSES_URL: http://localhost:9090
          PROM_URL: http://localhost:9091
        run: |
          set -euo pipefail
          kubectl port-forward -n monitoring svc/monitoring-kube-prometheus-stack-prometheus 9091:9090 &
          svc="$(kubectl get svc -n perses -l app.kubernetes.io/name=perses -o jsonpath='{.items[0].metadata.name}')"
          kubectl port-forward -n perses "svc/${svc}" 9090:8080 &
          sleep 5
          curl -sf "${PROM_URL}/-/healthy" > /dev/null
          curl -sf "${PERSES_URL}/" > /dev/null

      - name: Run ${{ matrix.slug }} guide
        env:
          GUIDE: website/${{ matrix.slug }}.md
          GUIDE_WORKDIR: /tmp/guide-work-${{ matrix.slug }}
          REPO_ROOT: ${{ github.workspace }}
          CHART_VERSION: ${{ env.CHART_VERSION }}
          DOCS_VERSION: ${{ env.DOCS_VERSION }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PERSES_URL: http://localhost:9090
          PROM_URL: http://localhost:9091
          DRY_RUN: 'false'
        run: uv run test/e2e/run-guide.py

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get gateway,httproutes,inferencepools,models -n thalamus -o yaml || true
