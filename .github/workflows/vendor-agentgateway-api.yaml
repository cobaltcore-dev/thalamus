name: Vendor agentgateway API pin

on:
  pull_request:
    types: [opened]
    paths:
      - 'go.mod'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to update'
        required: true

concurrency:
  group: vendor-agentgateway-api-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.user.login == 'app/renovate' && contains(github.head_ref, 'agentgateway'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Determine target branch
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch=$(gh pr view "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          else
            branch="$HEAD_REF"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Sync agentgateway/api pin
        run: |
          sh hack/sync-agentgateway-api.sh
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: sync agentgateway/api pin"
          git push origin HEAD
