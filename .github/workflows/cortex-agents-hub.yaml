# Cortex Agents stub. Activated by .github/cortex-agents.config.yaml; with no
# config file, or every feature inactive, nothing runs. All secrets come from
# cobaltcore-dev organization secrets (secrets: inherit) — see the .agents/
# README in cobaltcore-dev/cortex for org setup and the config schema.
#
# All gating and fan-out live in the entry workflow in cortex; this stub only
# holds what GitHub requires in the consuming repo: the triggers, the secrets
# consent, and the permissions consent (the union of what the agents may
# request — every job inside cortex downgrades to what it uses). The cron
# drives the bugfinder/docswriter passes; edit it here to change the cadence.
#
# The uses: pin below is the only cortex version reference — the entry
# workflow resolves its own commit from it and runs everything from it.

name: Cortex Agents

on:
  pull_request_target:
    types: [opened, synchronize]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * 1"  # 06:00 UTC every Monday — bugfinder + docswriter
  workflow_dispatch:
    inputs:
      feature:
        description: "Which feature to run (bugfinder, docswriter). Leave empty to run both scheduled features."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  cortex-agents:
    uses: cobaltcore-dev/cortex/.github/workflows/cortex-agents-entry.yaml@7d02a7a1187ff03fb7562a611691385f2ea27923
    secrets: inherit
