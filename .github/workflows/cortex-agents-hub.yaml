name: Cortex Agents

on:
  pull_request_target:
    types: [opened, synchronize]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * 1"  # 06:00 UTC every Monday — bugfinder + docswriter
  workflow_dispatch:
    inputs:
      feature:
        description: "Which feature to run (bugfinder, docswriter). Leave empty to run both scheduled features."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  cortex-agents:
    uses: cobaltcore-dev/cortex/.github/workflows/cortex-agents-entry.yaml@4b55055cca236490ebcdf7a0e2c5de43f6860146
    secrets: inherit
