name: Checks
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.22.1
      - name: Run make generate docs lint-fix
        run: make generate docs lint-fix
      - name: Check for diff
        run: |
          set -e
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate docs lint-fix' and commit the changes."
            exit 1
          fi
          if git ls-files --others --exclude-standard | grep -q .; then
            echo "::error::Untracked files after generation:"
            git ls-files --others --exclude-standard
            exit 1
          fi
      - name: Run golangci-lint
        run: |
          set -eux
          make lint
      - name: Run tests
        run: |
          set -eux
          make test
