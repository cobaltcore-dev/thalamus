name: Vendor Gateway API CRDs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'helm/Makefile'
      - 'helm/gateway-api/**'
      - 'helm/gateway-api-inference-extension/**'

concurrency:
  group: vendor-gateway-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vendor:
    if: github.event.pull_request.user.login == 'renovate[bot]' && contains(github.head_ref, 'gateway-api')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      - name: Sync vendored Gateway API CRDs
        run: |
          make -C helm vendor-crds
          go mod tidy
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync vendored gateway-api CRDs"
          git push origin HEAD
