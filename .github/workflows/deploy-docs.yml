name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'website/**'
      - 'api/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate API reference docs
        run: make docs

      - name: Set release metadata
        id: set-version
        run: |
          # Latest released tag, or "main" when no release exists yet.
          latest_release="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          [[ -n "$latest_release" ]] || latest_release="main"
          # All release tags, newest first, comma separated (e.g. "v0.2.0,v0.1.0").
          versions="$(git tag --list 'v*' --sort=-v:refname | paste -sd, -)"
          # Absolute origin of the GitHub Pages site (owner must be lowercase).
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docs_base_url="https://${owner_lc}.github.io"
          echo "latest_release=$latest_release" >> $GITHUB_OUTPUT
          echo "versions=$versions" >> $GITHUB_OUTPUT
          echo "docs_base_url=$docs_base_url" >> $GITHUB_OUTPUT

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python + bash kernel
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bash kernel
        run: |
          pip install jupyter bash_kernel
          python -m bash_kernel.install --user

      - name: Render executable docs
        run: |
          for qmd in docs/*.qmd; do
            quarto render "$qmd" --to gfm --no-execute -o - > "website/$(basename "$qmd" .qmd).md"
          done
        env:
          THALAMUS_CHART_LOCATION: oci://ghcr.io/cobaltcore-dev/charts
          THALAMUS_CHART_VERSION: ${{ github.ref == 'refs/heads/main' && '0.0.0-main' || github.ref_name }}
          OPERATOR_IMAGE_TAG: ''

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress site
        working-directory: website
        run: npm run docs:build
        env:
          PAGES_BASE: ${{ github.event.repository.name }}
          DOCS_BASE_URL: ${{ steps.set-version.outputs.docs_base_url }}
          DOCUMENTATION_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Generate root redirect and version manifest
        id: root-redirect
        run: |
          target="${{ steps.set-version.outputs.latest_release }}"
          versions="${{ steps.set-version.outputs.versions }}"
          url="/${{ github.event.repository.name }}/${target}/"
          out="${RUNNER_TEMP}/root-redirect"
          mkdir -p "$out"
          touch "$out/.nojekyll"
          cat > "$out/index.html" <<-EOF
          	<!DOCTYPE html>
          	<html>
          	  <head>
          	    <meta charset="utf-8">
          	    <meta http-equiv="refresh" content="0; url=${url}">
          	    <link rel="canonical" href="${{ steps.set-version.outputs.docs_base_url }}${url}">
          	    <title>Thalamus Documentation</title>
          	  </head>
          	  <body>
          	    <p>Redirecting to the latest documentation at <a href="${url}">${url}</a>…</p>
          	  </body>
          	</html>
          	EOF
          jq -n --arg latest "$target" --arg csv "$versions" \
            '{ latest: $latest, versions: ($csv | split(",") | map(select(. != ""))) }' \
            > "$out/versions.json"
          echo "path=$out" >> $GITHUB_OUTPUT

      - name: Deploy versioned docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/.vitepress/dist
          branch: gh-pages
          target-folder: ${{ github.ref_name }}
          clean-exclude: pr-preview
          force: false

      - name: Deploy root redirect
        if: ${{ steps.root-redirect.outputs.path != '' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.root-redirect.outputs.path }}
          branch: gh-pages
          target-folder: .
          clean: false
          force: false
