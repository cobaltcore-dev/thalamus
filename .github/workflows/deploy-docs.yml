name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'website/**'
      - 'api/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate API reference docs
        run: make docs

      - name: Set documentation version
        id: set-version
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            version="main"
            chart_version="0.0.0-main"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            chart_version="${version}"
          else
            # Manual dispatch off main/tags: derive from the ref name so the
            # build env stays complete (config.mts has no fallbacks).
            version="${GITHUB_REF_NAME:-local}"
            safe_ref="$(echo "${version}" | tr -c '0-9A-Za-z.-' '-')"
            chart_version="0.0.0-${safe_ref}"
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "chart_version=${chart_version}" >> $GITHUB_OUTPUT
          echo "base=/thalamus/${version}/" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress site
        working-directory: website
        run: npm run docs:build
        env:
          DOCS_VERSION: ${{ steps.set-version.outputs.version }}
          CHART_VERSION: ${{ steps.set-version.outputs.chart_version }}
          DOCS_BASE: ${{ steps.set-version.outputs.base }}
          DOCS_SHA: ${{ github.sha }}
          DOCS_REPO: ${{ github.repository }}

      - name: Deploy versioned docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/.vitepress/dist
          branch: gh-pages
          target-folder: ${{ steps.set-version.outputs.version }}
          clean-exclude: pr-preview
          force: false

      - name: Deploy root redirect
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/public/root
          branch: gh-pages
          target-folder: .
          clean: false
          force: false
