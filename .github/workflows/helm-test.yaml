name: Helm Test

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  helm-test:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Helm unit tests
        run: make helm-unittest
