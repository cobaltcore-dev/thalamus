name: Helm Charts

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Build dependencies
        run: helm dependency build helm/thalamus

      - name: Lint
        run: helm lint helm/thalamus

  publish:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Build dependencies
        run: helm dependency build helm/thalamus

      # Same tag strategy as the Docker workflow, so chart tags match image tags.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Helm login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # Tags that are not valid semver (branch, latest, SHA) are published as
      # 0.0.0-<tag> so they remain selectable via --version.
      - name: Package and push chart
        run: |
          set -euo pipefail
          dist="$(mktemp -d)"
          trap 'rm -rf "${dist}"' EXIT
          helm dependency build helm/thalamus
          while IFS= read -r tag; do
            if [[ "${tag}" =~ ^v?[0-9]+(\.[0-9]+){0,2}([+-][0-9A-Za-z.-]+)?$ ]]; then
              version="${tag}"
            else
              version="0.0.0-${tag}"
            fi
            helm package "helm/thalamus" -d "${dist}" \
              --version "${version}" --app-version "${tag}"
            helm push "${dist}/thalamus-${version}.tgz" \
              "oci://ghcr.io/${{ github.repository_owner }}/charts"
            echo "Pushed oci://ghcr.io/${{ github.repository_owner }}/charts/thalamus:${version} (appVersion ${tag})"
          done <<< "${{ steps.meta.outputs.tags }}"
