name: Helm Charts

"on":
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (${{ matrix.chart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: [thalamus, thalamus-crds]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.4

      - name: Lint
        run: helm lint helm/${{ matrix.chart }}

  publish:
    name: Publish (${{ matrix.chart }})
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart: [thalamus, thalamus-crds]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      # oras instead of helm push, which can't tag by branch/SHA/latest.
      - name: Set up oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/charts/${{ matrix.chart }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # appVersion = tag, so chart tag T deploys image tag T.
      - name: Package and push chart
        env:
          CHART: ${{ matrix.chart }}
          CHART_DIR: helm/${{ matrix.chart }}
          IMAGE: ghcr.io/${{ github.repository }}/charts/${{ matrix.chart }}
          TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${META_VERSION:-$(awk '/^version:/{print $2; exit}' "${CHART_DIR}/Chart.yaml")}"
          printf '{}' > chart-config.json
          IFS=',' read -r -a tag_list <<< "${TAGS}"
          for tag in "${tag_list[@]}"; do
            helm package "${CHART_DIR}" -d dist \
              --version "${version}" \
              --app-version "${tag}"
            printf '%s' "${GITHUB_TOKEN}" | oras push \
              "${IMAGE}:${tag}" \
              "dist/${CHART}-${version}.tgz:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
              --config "chart-config.json:application/vnd.cncf.helm.config.v1+json" \
              --username "${GITHUB_ACTOR}" --password -
            echo "Pushed oci://${IMAGE}:${tag} (chart version ${version}, appVersion ${tag})"
          done
