name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E
    runs-on: large_runner_16core_64gb
    timeout-minutes: 30
    env:
      REF: ${{ github.head_ref || github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute docs (PR)
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DOCKER_BUILD_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
        run: make docker-build helm-build quarto

      - name: Execute docs (release)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          THALAMUS_CHART_LOCATION: oci://ghcr.io/cobaltcore-dev/charts
          THALAMUS_CHART_VERSION: ${{ github.ref == 'refs/heads/main' && '0.0.0-main' || github.ref_name }}
          OPERATOR_IMAGE_TAG: ${{ github.ref_name }}
        run: |
          until helm show chart "${THALAMUS_CHART_LOCATION}/thalamus" --version "$THALAMUS_CHART_VERSION" >/dev/null 2>&1 \
            && docker manifest inspect "ghcr.io/${REPOSITORY}:${OPERATOR_IMAGE_TAG}" >/dev/null 2>&1; do
            sleep 15
          done
          make quarto

      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get gateway,httproutes,inferencepools,models -n thalamus -o yaml || true
