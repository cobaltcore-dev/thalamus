name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: large_runner_16core_64gb
    container:
      image: ghcr.io/astral-sh/uv:0.12.8-python3.13-trixie-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: model
          - name: components

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.31.12

      - name: Install helmfile
        uses: helmfile/helmfile-action@v2.4.7
        with:
          helmfile-version: v1.6.0
          helm-version: v3.17.3
          helm-plugins: >
            https://github.com/databus23/helm-diff@v3.9.14

      - name: Create namespace
        run: |
          kubectl create namespace thalamus
          kubectl create secret generic hf-token \
            --namespace thalamus \
            --from-literal=HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Build and load operator image
        run: |
          docker build -t ghcr.io/cobaltcore-dev/thalamus:pr -f Dockerfile .
          kind load docker-image ghcr.io/cobaltcore-dev/thalamus:pr \
            --name thalamus

      - name: Deploy Thalamus
        working-directory: helm
        run: |
          helmfile --file helmfile.yaml.gotmpl apply \
            --skip-diff-on-install \
            --wait=true \
            --timeout=600 \
            --state-values-file ${{ github.workspace }}/test/e2e/values.${{ matrix.name }}.yaml \
            --state-values-set thalamus.operator.image.tag=pr

      - name: Wait for gateway
        run: |
          kubectl wait gateway/inference-gateway \
            --namespace thalamus \
            --for=condition=Programmed=True \
            --timeout=120s

      - name: Apply Model CR
        if: matrix.name == 'model'
        run: |
          kubectl apply -f ${{ github.workspace }}/test/e2e/model.cpu.yaml

      - name: Wait for model readiness
        if: matrix.name == 'model'
        run: |
          kubectl wait model/smollm2-135m \
            --namespace thalamus \
            --for=condition=Ready \
            --timeout=600s

      - name: Port-forward gateway
        if: matrix.name == 'model'
        run: |
          kubectl port-forward svc/inference-gateway \
            8080:80 --namespace thalamus &
          sleep 3

      - name: Run e2e validation
        if: matrix.name == 'model'
        env:
          GATEWAY_HOST: localhost
          GATEWAY_PORT: "8080"
          MODEL: HuggingFaceTB/SmolLM2-135M-Instruct
        run: uv run test/e2e/validate.py

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Node resources ==="
          kubectl describe node thalamus-control-plane | grep -A20 "Allocated resources"
          echo "=== Pods ==="
          kubectl get pods -A -o json \
            | jq -r '
              .items[]
              | select(
                  any(.status.containerStatuses[]?;
                      .ready == false
                  )
              )
              | "\(.metadata.namespace) \(.metadata.name)"
            ' \
            | while read ns pod; do
                echo "===== $ns/$pod (current) ====="
                kubectl logs -n "$ns" "$pod" --all-containers=true --prefix=true || true

                echo "===== $ns/$pod (previous) ====="
                kubectl logs -n "$ns" "$pod" --all-containers=true --previous --prefix=true || true

                echo
              done
          echo "=== Gateway / HTTPRoutes / InferencePools ==="
          kubectl get gateway,httproutes,inferencepools -n thalamus -o yaml
          echo "=== Collecting complete Kind node logs ==="
          mkdir -p debug-logs
          docker exec thalamus-control-plane sh -c \
            'tar -czhf - /var/log/containers/ 2>/dev/null' \
            > debug-logs/node-logs.tar.gz

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-debug-logs
          path: debug-logs/
          retention-days: 1
