name: E2E

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.guide }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        guide: [getting-started, open-webui, perses-dashboards]
    permissions:
      actions: read
      contents: read
    env:
      REPOSITORY: ${{ github.repository }}
      THALAMUS_IMAGE_TAG: dev
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from source
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          DOCKER_BUILD_ARGS: --load --cache-from type=gha --cache-to type=gha,mode=max
        run: make e2e-build

      - name: Wait for publish workflows
        # main/tags validate published artifacts; wait for this commit's runs.
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 20
        run: |
          for wf in "Helm Charts" "Docker Images"; do
            id=""
            until [ -n "$id" ]; do
              id="$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [ -n "$id" ] || sleep 5
            done
            gh run watch "$id" --exit-status
          done

      - name: Execute docs (build from source)
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          set -o pipefail
          make e2e-docs E2E_GUIDE="${{ matrix.guide }}" | tee "${{ matrix.guide }}.md"

      - name: Execute docs (published)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          ROOT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          THALAMUS_CHART_LOCATION: oci://ghcr.io/${{ github.repository_owner }}/charts
          THALAMUS_CHART_VERSION: ${{ github.ref == 'refs/heads/main' && '0.0.0-main' || github.ref_name }}
          # Empty: exercise chart default tag ("" -> appVersion).
          THALAMUS_IMAGE_TAG: ''
        run: |
          set -o pipefail
          make e2e-docs E2E_GUIDE="${{ matrix.guide }}" | tee "${{ matrix.guide }}.md"

      - name: Save rendered guide
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.guide }}
          path: ${{ matrix.guide }}.md
          if-no-files-found: error

  publish-docs:
    name: Publish docs
    needs: e2e
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF: ${{ github.ref_name }}
    concurrency:
      group: pages-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate API reference docs
        run: make docs

      - name: Download rendered guides
        uses: actions/download-artifact@v4
        with:
          pattern: docs-*
          path: website/
          merge-multiple: true

      - name: Set release metadata
        id: set-version
        run: |
          # Latest released tag, or "main" when no release exists yet.
          latest_release="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          [[ -n "$latest_release" ]] || latest_release="main"
          # All release tags, newest first, comma separated (e.g. "v0.2.0,v0.1.0").
          versions="$(git tag --list 'v*' --sort=-v:refname | paste -sd, -)"
          # Absolute origin of the GitHub Pages site (owner must be lowercase).
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          docs_base_url="https://${owner_lc}.github.io"
          echo "latest_release=$latest_release" >> $GITHUB_OUTPUT
          echo "versions=$versions" >> $GITHUB_OUTPUT
          echo "docs_base_url=$docs_base_url" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build VitePress site
        working-directory: website
        run: npm run docs:build
        env:
          PAGES_BASE: ${{ github.event.repository.name }}
          DOCS_BASE_URL: ${{ steps.set-version.outputs.docs_base_url }}
          DOCUMENTATION_REPOSITORY_URL: https://github.com/${{ github.repository }}

      - name: Generate root redirect and version manifest
        id: root-redirect
        run: |
          target="${{ steps.set-version.outputs.latest_release }}"
          versions="${{ steps.set-version.outputs.versions }}"
          url="/${{ github.event.repository.name }}/${target}/"
          out="${RUNNER_TEMP}/root-redirect"
          mkdir -p "$out"
          touch "$out/.nojekyll"
          cat > "$out/index.html" <<-EOF
          	<!DOCTYPE html>
          	<html>
          	  <head>
          	    <meta charset="utf-8">
          	    <meta http-equiv="refresh" content="0; url=${url}">
          	    <link rel="canonical" href="${{ steps.set-version.outputs.docs_base_url }}${url}">
          	    <title>Thalamus Documentation</title>
          	  </head>
          	  <body>
          	    <p>Redirecting to the latest documentation at <a href="${url}">${url}</a>…</p>
          	  </body>
          	</html>
          	EOF
          jq -n --arg latest "$target" --arg csv "$versions" \
            '{ latest: $latest, versions: ($csv | split(",") | map(select(. != ""))) }' \
            > "$out/versions.json"
          echo "path=$out" >> $GITHUB_OUTPUT

      - name: Deploy versioned docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/.vitepress/dist
          branch: gh-pages
          target-folder: ${{ github.ref_name }}
          clean-exclude: pr-preview
          force: false

      - name: Deploy root redirect
        if: ${{ steps.root-redirect.outputs.path != '' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.root-redirect.outputs.path }}
          branch: gh-pages
          target-folder: .
          clean: false
          force: false
