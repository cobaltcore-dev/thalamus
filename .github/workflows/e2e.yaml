name: E2E

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.guide }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        guide: [getting-started, open-webui]
    permissions:
      contents: read
      actions: read
    env:
      REF: ${{ github.head_ref || github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      OPERATOR_IMAGE_TAG: dev
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from source
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          DOCKER_BUILD_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
        run: make e2e-build

      - name: Wait for publish workflows
        # main/tags validate published artifacts; wait for this commit's runs.
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 20
        run: |
          for wf in "Helm Charts" "Docker Images"; do
            id=""
            until [ -n "$id" ]; do
              id="$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
              [ -n "$id" ] || sleep 5
            done
            gh run watch "$id" --exit-status
          done

      - name: Execute docs (build from source)
        if: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make e2e-docs E2E_GUIDE="${{ matrix.guide }}"

      - name: Execute docs (published)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          THALAMUS_CHART_LOCATION: oci://ghcr.io/${{ github.repository_owner }}/charts
          THALAMUS_CHART_VERSION: ${{ github.ref == 'refs/heads/main' && '0.0.0-main' || github.ref_name }}
          # Empty: exercise chart default tag ("" -> appVersion).
          OPERATOR_IMAGE_TAG: ''
          ROOT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: make e2e-docs E2E_GUIDE="${{ matrix.guide }}"
