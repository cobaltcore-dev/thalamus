name: E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (operator image, helm chart)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute artifact tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "chart_version=0.0.0-sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts directory
        run: mkdir -p "${RUNNER_TEMP}/build-artifacts"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: release
          platforms: linux/amd64
          tags: ghcr.io/cobaltcore-dev/thalamus:${{ steps.meta.outputs.image_tag }}
          outputs: type=docker,dest=${{ runner.temp }}/build-artifacts/operator-image.tar
          cache-from: type=gha,scope=e2e-operator
          cache-to: type=gha,mode=max,scope=e2e-operator
          provenance: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.22.1

      - name: Package Helm chart
        env:
          APP_VERSION: ${{ steps.meta.outputs.image_tag }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
        run: |
          helm dependency build helm/thalamus
          helm package helm/thalamus -d "${RUNNER_TEMP}/build-artifacts" \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"
          mv "${RUNNER_TEMP}/build-artifacts/thalamus-${CHART_VERSION}.tgz" \
            "${RUNNER_TEMP}/build-artifacts/thalamus-chart.tgz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-artifacts
          path: ${{ runner.temp }}/build-artifacts/
          retention-days: 1

  install:
    name: Install (${{ matrix.gateway_api }} gateway-api, ${{ matrix.inference_extension }} inference-extension, ${{ matrix.agentgateway }} agentgateway)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gateway_api: [bundled, preinstalled]
        inference_extension: [bundled, preinstalled]
        agentgateway: [bundled, preinstalled]

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.22.1

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: ${{ runner.temp }}/build-artifacts

      - name: Load operator image into Kind
        run: |
          kind load image-archive "${RUNNER_TEMP}/build-artifacts/operator-image.tar" \
            --name thalamus

      - name: Pre-install gateway-api CRDs from upstream
        if: matrix.gateway_api == 'preinstalled'
        run: |
          version="$(sed -n 's/^GATEWAY_API_VERSION[[:space:]]*?=[[:space:]]*//p' helm/Makefile)"
          curl -fsSL -o /tmp/gateway-api-standard-install.yaml \
            "https://github.com/kubernetes-sigs/gateway-api/releases/download/${version}/standard-install.yaml"
          kubectl apply -f /tmp/gateway-api-standard-install.yaml
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io

      - name: Pre-install gateway-api-inference-extension CRDs from upstream
        if: matrix.inference_extension == 'preinstalled'
        run: |
          version="$(sed -n 's/^GATEWAY_API_INFERENCE_EXTENSION_VERSION[[:space:]]*?=[[:space:]]*//p' helm/Makefile)"
          curl -fsSL -o /tmp/ie-v1-manifests.yaml \
            "https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/${version}/v1-manifests.yaml"
          kubectl apply -f /tmp/ie-v1-manifests.yaml
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/inferencepools.inference.networking.k8s.io

      - name: Pre-install agentgateway CRDs from upstream
        if: matrix.agentgateway == 'preinstalled'
        run: |
          version="$(awk '/^  - name: agentgateway-crds$/ { f = 1; next } f && /^    version:/ { print $2; exit }' helm/thalamus/Chart.yaml)"
          if [ -z "$version" ]; then
            echo "FAIL: could not parse agentgateway-crds chart version from helm/thalamus/Chart.yaml"
            exit 1
          fi
          helm upgrade --install agentgateway-crds oci://cr.agentgateway.dev/charts/agentgateway-crds \
            --version "$version" \
            --namespace thalamus \
            --create-namespace \
            --wait \
            --timeout=600s
          helm get manifest agentgateway-crds --namespace thalamus > /tmp/agw-crds.yaml
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/agentgatewaybackends.agentgateway.dev \
            crd/agentgatewayparameters.agentgateway.dev \
            crd/agentgatewaypolicies.agentgateway.dev

      - name: Pre-install agentgateway from upstream
        if: matrix.agentgateway == 'preinstalled'
        run: |
          version="$(awk '/^  - name: agentgateway$/ { f = 1; next } f && /^    version:/ { print $2; exit }' helm/thalamus/Chart.yaml)"
          if [ -z "$version" ]; then
            echo "FAIL: could not parse agentgateway chart version from helm/thalamus/Chart.yaml"
            exit 1
          fi
          helm upgrade --install agentgateway oci://cr.agentgateway.dev/charts/agentgateway \
            --version "$version" \
            --namespace thalamus \
            --set inferenceExtension.enabled=true \
            --wait \
            --timeout=600s

      - name: Deploy Thalamus
        run: |
          flags=()
          if [ "${{ matrix.gateway_api }}" = "preinstalled" ]; then
            flags+=(--set gateway-api.enabled=false)
          fi
          if [ "${{ matrix.inference_extension }}" = "preinstalled" ]; then
            flags+=(--set gateway-api-inference-extension.enabled=false)
          fi
          if [ "${{ matrix.agentgateway }}" = "preinstalled" ]; then
            flags+=(--set agentgateway-crds.enabled=false)
            flags+=(--set agentgateway.enabled=false)
          fi
          helm upgrade --install thalamus \
            "${RUNNER_TEMP}/build-artifacts/thalamus-chart.tgz" \
            --namespace thalamus \
            --create-namespace \
            --wait \
            --timeout=600s \
            --set operator.image.tag=${{ needs.build.outputs.image_tag }} \
            "${flags[@]}"

      - name: Verify disabled CRD dependencies were skipped
        if: matrix.gateway_api == 'preinstalled' || matrix.inference_extension == 'preinstalled' || matrix.agentgateway == 'preinstalled'
        run: |
          manifest="$(helm get manifest thalamus --namespace thalamus)"
          assert_skipped() {
            for name in $(awk '/^  name: / { print $2 }' "$1" | tr -d '"'); do
              if printf '%s' "$manifest" | grep -q "^  name: ${name}$"; then
                echo "FAIL: thalamus installed ${name} despite its dependency being disabled"
                exit 1
              fi
            done
          }
          if [ "${{ matrix.gateway_api }}" = "preinstalled" ]; then
            assert_skipped /tmp/gateway-api-standard-install.yaml
          fi
          if [ "${{ matrix.inference_extension }}" = "preinstalled" ]; then
            assert_skipped /tmp/ie-v1-manifests.yaml
          fi
          if [ "${{ matrix.agentgateway }}" = "preinstalled" ]; then
            assert_skipped /tmp/agw-crds.yaml
          fi
          printf '%s' "$manifest" | grep -q '^  name: models.thalamus.cloud'
          printf '%s' "$manifest" | grep -q '^  name: modelartifacts.thalamus.cloud'
          echo "PASS: thalamus skipped all disabled CRD dependencies"

      - name: Verify disabled agentgateway controller was skipped
        if: matrix.agentgateway == 'preinstalled'
        run: |
          thalamus_manifest="$(helm get manifest thalamus --namespace thalamus)"
          if printf '%s' "$thalamus_manifest" | grep -q 'app.kubernetes.io/name: agentgateway'; then
            echo "FAIL: thalamus installed the agentgateway controller despite its dependency being disabled"
            exit 1
          fi
          echo "PASS: thalamus skipped the bundled agentgateway controller"

      - name: Verify CRDs
        run: |
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            crd/inferencepools.inference.networking.k8s.io \
            crd/agentgatewaypolicies.agentgateway.dev \
            crd/models.thalamus.cloud \
            crd/modelartifacts.thalamus.cloud

      - name: Verify Model argument validation
        run: |
          kubectl apply --dry-run=server -f ${{ github.workspace }}/examples/model-smollm2-cpu.yaml >/dev/null
          echo "PASS: compliant Model admitted"
          if kubectl apply --dry-run=server -f ${{ github.workspace }}/test/e2e/fixtures/model-forbidden-flags.yaml 2>&1 \
            | grep -q "must not set --port (managed by the operator)"; then
            echo "PASS: Model setting --port denied at admission"
          else
            echo "FAIL: Model setting --port was not denied with the expected message"
            exit 1
          fi

      - name: Create inference gateway
        run: |
          kubectl apply -f ${{ github.workspace }}/examples/gateway.yaml

      - name: Wait for Gateway
        run: |
          kubectl wait gateway/inference-gateway \
            --namespace thalamus \
            --for=condition=Programmed=True \
            --timeout=120s

      - name: Show events on failure
        if: failure()
        run: |
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

  inference:
    name: Inference (v1 endpoints, ${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default
            example: examples/model-smollm2-cpu.yaml
            model_name: smollm2-135m
            model_id: HuggingFaceTB/SmolLM2-135M-Instruct
          - scenario: speculative-decoding
            example: examples/model-smollm2-360m-spec-cpu.yaml
            model_name: smollm2-360m-spec
            model_id: HuggingFaceTB/SmolLM2-360M-Instruct
          - scenario: prefetch
            example: examples/model-smollm2-cpu-prefetch.yaml
            model_name: smollm2-135m-prefetch
            model_id: HuggingFaceTB/SmolLM2-135M-Instruct
          - scenario: modelpack
            example: examples/model-tiny-qwen2-modelpack.yaml
            model_name: tiny-qwen2-modelpack
            model_id: ghcr.io/modelpack/trl-internal-testing-tiny-qwen2forcausallm-2.5:latest
    env:
      GATEWAY_HOST: localhost
      GATEWAY_PORT: "8080"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: thalamus
          node_image: kindest/node:v1.37.0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.22.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-artifacts
          path: ${{ runner.temp }}/build-artifacts

      - name: Load operator image into Kind
        run: |
          kind load image-archive "${RUNNER_TEMP}/build-artifacts/operator-image.tar" \
            --name thalamus

      - name: Deploy Thalamus
        run: |
          helm upgrade --install thalamus \
            "${RUNNER_TEMP}/build-artifacts/thalamus-chart.tgz" \
            --namespace thalamus \
            --create-namespace \
            --wait \
            --timeout=600s \
            --set operator.image.tag=${{ needs.build.outputs.image_tag }}

      - name: Create inference gateway
        run: |
          kubectl apply -f ${{ github.workspace }}/examples/gateway.yaml

      - name: Wait for Gateway
        run: |
          kubectl wait gateway/inference-gateway \
            --namespace thalamus \
            --for=condition=Programmed=True \
            --timeout=120s

      - name: Create huggingface Secret
        run: |
          kubectl create secret generic hf-token \
            --namespace thalamus \
            --from-literal=HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Apply Artifact and Model
        run: |
          kubectl apply -f ${{ github.workspace }}/${{ matrix.example }}

      - name: Wait for artifact prefetch
        if: matrix.scenario == 'prefetch'
        run: |
          kubectl wait modelartifact/${{ matrix.model_name }} \
            --namespace thalamus \
            --for=condition=Ready \
            --timeout=600s
          kubectl wait job/${{ matrix.model_name }}-download \
            --namespace thalamus \
            --for=condition=Complete \
            --timeout=600s

      - name: Wait for Model readiness
        run: |
          kubectl wait model/${{ matrix.model_name }} \
            --namespace thalamus \
            --for=condition=Ready \
            --timeout=600s

      - name: Verify speculative decoding is active
        if: matrix.scenario == 'speculative-decoding'
        run: |
          # Spec decoding is API-transparent, so only engine logs prove drafter
          kubectl logs -n thalamus "$(kubectl get pods -n thalamus \
            -l thalamus.cloud/engine=smollm2-360m-spec-engine \
            --field-selector=status.phase=Running -o name | head -1)" \
            | grep -F "SpeculativeConfig(method='draft_model'" \
            || { echo "FAIL: draft model not active in engine logs"; exit 1; }

      - name: Port-forward Gateway
        run: |
          kubectl port-forward svc/inference-gateway \
            8080:80 --namespace thalamus &
          sleep 3

      - name: Run e2e validation
        env:
          MODEL: ${{ matrix.model_id }}
        run: uv run test/e2e/validate.py

      - name: Add alias to the Model
        run: |
          kubectl patch model ${{ matrix.model_name }} \
            --namespace thalamus \
            --type merge \
            -p '{"spec":{"aliases":["${{ matrix.model_id }}-e2e"]}}'

          generation="$(kubectl get model ${{ matrix.model_name }} \
            --namespace thalamus \
            -o jsonpath='{.metadata.generation}')"
          kubectl wait model/${{ matrix.model_name }} \
            --namespace thalamus \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].observedGeneration}'="$generation" \
            --for=condition=Ready \
            --timeout=120s

      - name: Run e2e validation with alias
        env:
          MODEL: ${{ matrix.model_id }}-e2e
        run: uv run test/e2e/validate.py

      - name: Assert old model name is no longer served
        env:
          MODEL: ${{ matrix.model_id }}
        run: |
          # /v1/models returns 200 even when the model is absent.
          if uv run test/e2e/validate.py models; then
            echo "FAIL: base model name is still listed in /v1/models"
            exit 1
          fi

          # validate.py prints the HTTP status from the SDK exception.
          for check in completions responses messages; do
            output="$(uv run test/e2e/validate.py "$check" 2>&1)" || true
            if ! grep -Fq "HTTP 404" <<< "$output"; then
              echo "FAIL: $check did not reject the base model name with 404:"
              echo "$output"
              exit 1
            fi
          done
          echo "PASS: base model name is absent from /v1/models and rejected with 404"

      - name: Verify uninstall removes models and CRDs
        run: |
          helm uninstall thalamus --namespace thalamus --wait --timeout 5m

          for crd in models.thalamus.cloud modelartifacts.thalamus.cloud; do
            if kubectl get crd "$crd" >/dev/null 2>&1; then
              echo "FAIL: $crd still exists after helm uninstall"
              kubectl get crd "$crd" -o yaml
              exit 1
            fi
          done

          for kind in serviceaccount role rolebinding job; do
            if kubectl -n thalamus get "$kind" thalamus-cleanup >/dev/null 2>&1; then
              echo "FAIL: cleanup $kind was left behind after helm uninstall"
              exit 1
            fi
          done

          echo "PASS: uninstall released the artifact finalizers and removed the CRDs"

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Node resources ==="
          kubectl describe node thalamus-control-plane | grep -A20 "Allocated resources"
          echo "=== Pods ==="
          kubectl get pods -A -o json \
            | jq -r '
              .items[]
              | select(
                  any(.status.containerStatuses[]?;
                      .ready == false
                  )
              )
              | "\(.metadata.namespace) \(.metadata.name)"
            ' \
            | while read ns pod; do
                echo "===== $ns/$pod (current) ====="
                kubectl logs -n "$ns" "$pod" --all-containers=true --prefix=true || true

                echo "===== $ns/$pod (previous) ====="
                kubectl logs -n "$ns" "$pod" --all-containers=true --previous --prefix=true || true

                echo
              done
          echo "=== Gateway / HTTPRoutes / InferencePools ==="
          kubectl get gateway,httproutes,inferencepools -n thalamus -o yaml
          echo "=== Collecting complete Kind node logs ==="
          mkdir -p debug-logs
          docker exec thalamus-control-plane sh -c \
            'tar -czhf - /var/log/containers/ 2>/dev/null' \
            > debug-logs/node-logs.tar.gz

      - name: Upload debug logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-inference-debug-logs-${{ matrix.scenario }}
          path: debug-logs/
          retention-days: 1
