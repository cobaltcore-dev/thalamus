thalamus:
  models:
    - name: Qwen/Qwen3.6-27B
      config: nvidia
      replicas: 1
      args:
        - "--tensor-parallel-size=2"
        - "--reasoning-parser=qwen3"
      resources:
        requests:
          nvidia.com/gpu: "2"
        limits:
          nvidia.com/gpu: "2"
