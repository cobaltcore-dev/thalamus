node-feature-discovery:
  enabled: false
gpu-operator:
  enabled: false

thalamus:
  models:
    - slug: smollm2-135m
      model: HuggingFaceTB/SmolLM2-135M-Instruct
      accelerator: cpu
      replicas: 1
      extraArgs:
        - "--max-model-len=512"
        - "--max-num-seqs=1"
        - "--enforce-eager"
      extraEnv:
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "1"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "nobind"
        - name: CPU_VISIBLE_MEMORY_NODES
          value: "0,1"
      resources:
        requests:
          cpu: "2"
          memory: "6Gi"
        limits:
          cpu: "4"
          memory: "6Gi"

  epp:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "200m"
        memory: "512Mi"
