image:
  registry: ""
  repository: model-server
  tag: "latest"
  pullPolicy: IfNotPresent
  digest: ""

replicaCount: 1

extraArgs:
  - "-config"
  - "/etc/model-server/model-server.yaml"

ocm:
  repositories:
    - name: primary
      type: OCIRegistry
      url: ""
  signatures:
    required: false
  refreshInterval: 5m
  indexTTL: 60s

apis:
  hfhub: true
  ollama: false
  openai: false
  mlflow: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi