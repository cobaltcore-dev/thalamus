apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  model-server.yaml: |
    server:
      listen: ":8080"
      readTimeout: 30s
      writeTimeout: 0s
      idleTimeout: 120s
      shutdownTimeout: 30s

    auth: # set up for CI workflows
      mode: none

    ocm:
      repositories:
        {{- range .Values.ocm.repositories }}
        - name: {{ .name }}
          type: {{ .type }}
          url: {{ .url | quote }}
        {{- end }}
      signatures:
        required: {{ .Values.ocm.signatures.required }}
      refreshInterval: {{ .Values.ocm.refreshInterval }}
      indexTTL: {{ .Values.ocm.indexTTL }}

    apis:
      hfhub:
        enabled: {{ .Values.apis.hfhub }}
      ollama:
        enabled: {{ .Values.apis.ollama }}
      openai:
        enabled: {{ .Values.apis.openai }}
      mlflow:
        enabled: {{ .Values.apis.mlflow }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: model-server
          image: {{ include "model-server.image" .Values.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/model-server
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 8080
      targetPort: http
      name: http
  type: ClusterIP