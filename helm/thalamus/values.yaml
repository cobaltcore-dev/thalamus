operator:
  enabled: true
  replicas: 1
  image:
    registry: ghcr.io
    repository: cobaltcore-dev/thalamus
    tag: ""  # defaults to chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  metrics:
    enabled: false
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

owner_info:
  support_group: workload-management
  service: thalamus

gateway:
  name: inference-gateway
  listeners:
    - port: 80
      protocol: HTTP
      name: default
      allowedRoutes:
        namespaces:
          from: All

  parameters:
    service:
      spec:
        type: ClusterIP
        # type: LoadBalancer
        # loadBalancerIP: ""

  policies:
    bbr:
      enabled: true
      traffic:
        phase: PreRouting
        transformation:
          request:
            set:
              - name: X-Gateway-Model-Name
                value: '"publishers/{{ .Release.Namespace }}/models/" + json(request.body).model'

    apikey-auth:
      enabled: false
      traffic:
        apiKeyAuthentication:
          mode: Strict
          secretSelector:
            matchLabels:
              thalamus-apikey: "true"

configs:
  image-overrides:
    spec:
      router:
        scheduler:
          template:
            containers:
              - name: main
                image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
              - name: tokenizer
                image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.9.0

  non-root:
    spec:
      template:
        containers:
          - name: main
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              privileged: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop: [ALL]

  nvidia:
    spec:
      template:
        containers:
          - name: main
            image: docker.io/vllm/vllm-openai:v0.24.0
            env:
              - name: NCCL_IB_DISABLE
                value: "1"
  cpu:
    spec:
      template:
        containers:
          - name: main
            image: docker.io/vllm/vllm-openai-cpu:v0.24.0
            securityContext:
              seccompProfile:
                type: Unconfined
              capabilities:
                add:
                  - SYS_NICE

# List of models to deploy. Each entry produces one LLMInferenceService
# (which the KServe controller expands into a workload Deployment, EPP,
# InferencePool, and HTTPRoute using the llm-d presets composed with the
# selected config plus the always-on `image-overrides`).
# Example:
# models:
#   - name: org/my-model            # HuggingFace model id; slug is auto-derived
#     config: nvidia                # which config from `.Values.configs` to compose
#     replicas: 1                   # optional; defaults to 1
#     args:                         # optional; passed as container args ($@ in the preset)
#       - "--tensor-parallel-size=2"
#     resources:
#       requests:
#         nvidia.com/gpu: "1"
#       limits:
#         nvidia.com/gpu: "1"
models: []

extraDeploy: []
