operator:
  replicas: 1
  image:
    registry: ghcr.io
    repository: cobaltcore-dev/thalamus
    tag: ""  # defaults to chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  metrics:
    enabled: false
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

owner_info:
  support_group: workload-management
  service: thalamus

gateway:
  name: inference-gateway
  annotations: {}
    # cert-manager.io/issuer: my-issuer
  listeners:
    http:
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    https-api:
      enabled: false
      port: 443
      protocol: HTTPS
      # hostname: api.example.com
      # tls:
      #   certificateRefs:
      #     - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    https-frontend:
      enabled: false
      port: 443
      protocol: HTTPS
      # hostname: example.com
      # tls:
      #   certificateRefs:
      #     - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All

  parameters:
    service:
      spec:
        type: ClusterIP
        # type: LoadBalancer
        # loadBalancerIP: ""

  # Map of AgentgatewayPolicy resources, keyed by name. Each entry renders one
  # policy; its body is used as the policy spec. `enabled: false` skips it.
  # `targetRefs` default to the Gateway and are merged per-entry, so an entry
  # need only specify the fields it overrides (e.g. `- sectionName: https-api`).
  # If the default Gateway target should not be used, either attach by label
  # with `targetSelectors`, or spell out full `targetRefs` entries.
  policies:
    bbr:
      # enabled: false
      traffic:
        phase: PreRouting
        transformation:
          request:
            set:
              - name: X-Gateway-Base-Model-Name
                value: json(request.body).model

    # Secrets holding keys must be labelled `thalamus-apikey: "true"`.
    apikey-auth:
      enabled: false
      traffic:
        apiKeyAuthentication:
          mode: Strict
          secretSelector:
            matchLabels:
              thalamus-apikey: "true"


extraDeploy: []
  # List of extra manifests (structured objects or templated strings).
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value
  #
  # Alternatively, use a map of structured manifests; keys inject metadata.name (for non-string objects) when not present. See tests/extra-deploy_test.yaml.
  # example-configmap:
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value

