operator:
  enabled: false
  replicas: 1
  image:
    registry: ghcr.io
    repository: cobaltcore-dev/thalamus
    tag: ""  # defaults to chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  metrics:
    enabled: false
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

owner_info:
  support_group: workload-management
  service: thalamus

gateway:
  name: inference-gateway
  annotations: {}
    # cert-manager.io/issuer: my-issuer
  listeners:
    http:
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    https-api:
      enabled: false
      port: 443
      protocol: HTTPS
      # hostname: api.example.com
      # tls:
      #   certificateRefs:
      #     - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All
    https-frontend:
      enabled: false
      port: 443
      protocol: HTTPS
      # hostname: example.com
      # tls:
      #   certificateRefs:
      #     - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All

  parameters:
    service:
      spec:
        type: ClusterIP
        # type: LoadBalancer
        # loadBalancerIP: ""

  # Map of AgentgatewayPolicy resources, keyed by name. Each entry renders one
  # policy; its body is used as the policy spec. `enabled: false` skips it.
  # `targetRefs` default to the Gateway and are merged per-entry, so an entry
  # need only specify the fields it overrides (e.g. `- sectionName: https-api`).
  # If the default Gateway target should not be used, either attach by label
  # with `targetSelectors`, or spell out full `targetRefs` entries.
  policies:
    bbr:
      # enabled: false
      traffic:
        phase: PreRouting
        transformation:
          request:
            set:
              - name: X-Gateway-Base-Model-Name
                value: json(request.body).model

    # Secrets holding keys must be labelled `thalamus-apikey: "true"`.
    apikey-auth:
      enabled: false
      traffic:
        apiKeyAuthentication:
          mode: Strict
          secretSelector:
            matchLabels:
              thalamus-apikey: "true"

# Accelerator profiles
accelerators:
  cpu:
    image:
      registry: docker.io
      repository: vllm/vllm-openai-cpu
      tag: v0.26.0
      digest: ""
      pullPolicy: IfNotPresent
    baseArgs: []
    baseEnv: []
    securityContext:
      seccompProfile:
        type: Unconfined
      capabilities:
        add:
          - SYS_NICE
  nvidia:
    image:
      registry: docker.io
      repository: vllm/vllm-openai
      tag: v0.26.0
      digest: ""
      pullPolicy: IfNotPresent
    baseArgs:
      - "--gpu-memory-utilization=0.95"
    baseEnv:
      - name: NCCL_P2P_LEVEL
        value: "PIX"
      - name: NCCL_IB_DISABLE
        value: "1"
    securityContext: {}

# List of models to deploy. Each entry produces a model Deployment, Service, and InferencePool.
# Example:
# models:
#   - slug: my-model
#     model: org/my-model
#     accelerator: nvidia
#     replicas: 1
#     extraArgs: []
#     extraEnv: []
#     resources:
#       requests:
#         nvidia.com/gpu: "1"
#       limits:
#         nvidia.com/gpu: "1"
#     # Volume source for the vLLM cache (/root/.cache). Defaults to emptyDir.
#     # Provide any Kubernetes volume source; the PVC must already exist.
#     cache:
#       persistentVolumeClaim:
#         claimName: my-model-cache
#     # Optional: constrain scheduling to specific nodes (e.g. GPU flavor).
#     nodeSelector:
#       nvidia.com/gpu.product: NVIDIA-RTX-PRO-6000-Blackwell-Server-Edition
models: []

# Endpoint Picker (EPP)
epp:
  image:
    registry: ghcr.io
    repository: llm-d/llm-d-router-endpoint-picker
    tag: v0.9.0
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 2Gi
  flowControl:
    enabled: false
    # saturationDetector:
    #   pluginRef: concurrency-detector  # defaults to utilization-detector
    # saturationDetectorPlugin:
    #   type: concurrency-detector

extraDeploy: []
  # List of extra manifests (structured objects or templated strings).
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value
  #
  # Alternatively, use a map of structured manifests; keys inject metadata.name (for non-string objects) when not present. See tests/extra-deploy_test.yaml.
  # example-configmap:
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value

defaultRoute: {}
