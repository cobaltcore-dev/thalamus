agentgateway:
  enabled: true
  inferenceExtension:
    enabled: true

agentgateway-crds:
  enabled: true

gateway-api:
  enabled: true

gateway-api-inference-extension:
  enabled: true

operator:
  replicas: 1
  image:
    registry: ghcr.io
    repository: cobaltcore-dev/thalamus
    tag: ""  # defaults to chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

monitoring:
  enabled: false
  interval: 15s
  scrapeTimeout: 5s
  additionalLabels: {}

  # Per-component overrides. Omitted fields inherit the values above.
  operator:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

  engine:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

  epp:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

# Gateway the operator attaches its routes to; see examples/gateway.yaml.
gateway:
  name: inference-gateway
  listener: api

extraDeploy: []
