operator:
  replicas: 1
  image:
    registry: ghcr.io
    repository: cobaltcore-dev/thalamus
    tag: ""  # defaults to chart appVersion
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop: [ALL]
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  serviceAccount:
    create: true
    name: ""
  rbac:
    create: true

monitoring:
  enabled: false
  interval: 15s
  scrapeTimeout: 5s
  additionalLabels: {}

  # Per-component overrides. Omitted fields inherit the values above.
  operator:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

  engine:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

  epp:
    # enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # additionalLabels: {}

owner_info:
  support_group: workload-management
  service: thalamus

gateway:
  name: inference-gateway
  annotations: {}
    # cert-manager.io/issuer: my-issuer
  listeners:
    # All OpenAI-compatible routes (per-model and model-list) attach to this listener by default.
    api:
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

  parameters:
    service:
      spec:
        type: ClusterIP
        # type: LoadBalancer
        # loadBalancerIP: ""

extraDeploy: []
  # List of extra manifests (structured objects or templated strings).
  # - apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     name: example-configmap
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value
  #
  # Alternatively, use a map of structured manifests; keys inject metadata.name (for non-string objects) when not present. See tests/extra-deploy_test.yaml.
  # example-configmap:
  #   apiVersion: v1
  #   kind: ConfigMap
  #   metadata:
  #     namespace: "{{ .Release.Namespace }}"
  #   data:
  #     example-key: example-value

