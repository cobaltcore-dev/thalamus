suite: extraDeploy template

templates:
  - extra-deploy.yaml

tests:
  - it: should render nothing by default
    set:
      extraDeploy: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a list of objects
    set:
      extraDeploy:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: list-configmap
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: list-configmap

  - it: should use map keys as object names
    set:
      extraDeploy:
        map-configmap:
          apiVersion: v1
          kind: ConfigMap
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: map-configmap

  - it: should not override user-provided metadata.name
    set:
      extraDeploy:
        map-key-name:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: existing-name
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: existing-name

  - it: should render string manifests in a map
    set:
      extraDeploy:
        string-configmap: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: explicit-name
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: explicit-name

  - it: should template values in string manifests
    release:
      name: thalamus
      namespace: thalamus
    set:
      extraDeploy:
        string-configmap: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: explicit-name
            namespace: "{{ .Release.Namespace }}"
          data:
            releaseName: '{{ "{{ .Release.Name }}" }}'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: thalamus
      - equal:
          path: data.releaseName
          value: "{{ .Release.Name }}"

  - it: should template values exactly once
    release:
      name: thalamus
      namespace: thalamus
    set:
      extraDeploy:
        templated-configmap:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            namespace: "{{ .Release.Namespace }}"
          data:
            releaseName: '{{ "{{ .Release.Name }}" }}'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: thalamus
      - equal:
          path: data.releaseName
          value: "{{ .Release.Name }}"

  - it: should render multiple map entries
    set:
      extraDeploy:
        first-configmap:
          apiVersion: v1
          kind: ConfigMap
        second-configmap:
          apiVersion: v1
          kind: ConfigMap
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: first-configmap
          any: true
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: second-configmap
          any: true

  - it: should fail on empty map values
    set:
      extraDeploy:
        empty-configmap: null
    asserts:
      - failedTemplate:
          errorMessage: 'extraDeploy entry "empty-configmap" has no content'

  - it: should support loops to create multiple objects from a string
    release:
      name: thalamus
      namespace: thalamus
    set:
      extraDeploy:
        - |
          {{- range $i := until 3 }}
          {{- if $i }}
          ---
          {{- end }}
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: looped-configmap-{{ $i }}
            namespace: "{{ $.Release.Namespace }}"
          data:
            index: "{{ $i }}"
          {{- end }}
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        equal:
          path: metadata.name
          value: looped-configmap-0
      - documentIndex: 1
        equal:
          path: metadata.name
          value: looped-configmap-1
      - documentIndex: 2
        equal:
          path: metadata.name
          value: looped-configmap-2
