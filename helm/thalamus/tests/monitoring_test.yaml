suite: monitoring template

templates:
  - monitoring.yaml

release:
  name: thalamus
  namespace: thalamus

tests:
  - it: should render no documents when monitoring is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render all three monitors when monitoring is globally enabled
    set:
      monitoring.enabled: true
    asserts:
      - hasDocuments:
          count: 3

  - it: should render only the operator ServiceMonitor when others are disabled
    set:
      monitoring.enabled: true
      monitoring.engine.enabled: false
      monitoring.epp.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
        documentIndex: 0
      - equal:
          path: metadata.name
          value: thalamus-operator
        documentIndex: 0

  - it: should set standard labels on the operator ServiceMonitor
    set:
      monitoring.enabled: true
      monitoring.engine.enabled: false
      monitoring.epp.enabled: false
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 0

  - it: should set standard labels on the engine PodMonitor
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.epp.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
        documentIndex: 0
      - equal:
          path: metadata.name
          value: thalamus-engine
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: thalamus-engine
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: engine
        documentIndex: 0

  - it: should set standard labels on the epp ServiceMonitor
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.engine.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
        documentIndex: 0
      - equal:
          path: metadata.name
          value: thalamus-epp
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: thalamus-epp
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: epp
        documentIndex: 0

  - it: should merge per-component additionalLabels over global additionalLabels
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.engine.enabled: false
      monitoring.additionalLabels.team: platform
      monitoring.epp.additionalLabels.team: inference
    asserts:
      - equal:
          path: metadata.labels.team
          value: inference
        documentIndex: 0

  - it: should apply global additionalLabels when no per-component override exists
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.engine.enabled: false
      monitoring.additionalLabels.team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
        documentIndex: 0

  - it: should use per-component interval and scrapeTimeout when set
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.epp.enabled: false
      monitoring.interval: 30s
      monitoring.engine.interval: 60s
      monitoring.engine.scrapeTimeout: 20s
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 60s
        documentIndex: 0
      - equal:
          path: spec.podMetricsEndpoints[0].scrapeTimeout
          value: 20s
        documentIndex: 0

  - it: should fall back to global interval and scrapeTimeout when per-component values are absent
    set:
      monitoring.enabled: true
      monitoring.operator.enabled: false
      monitoring.epp.enabled: false
      monitoring.interval: 45s
      monitoring.scrapeTimeout: 15s
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].interval
          value: 45s
        documentIndex: 0
      - equal:
          path: spec.podMetricsEndpoints[0].scrapeTimeout
          value: 15s
        documentIndex: 0
