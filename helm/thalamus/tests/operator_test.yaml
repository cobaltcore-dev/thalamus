suite: operator template

templates:
  - operator.yaml

release:
  name: thalamus
  namespace: thalamus

tests:
  - it: should carry the full label hierarchy on the Deployment
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: thalamus
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
        documentIndex: 4

  - it: should use selectorLabels (name + instance only) for matchLabels and pod template
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 4
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 4
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
        documentIndex: 4
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4

  - it: should carry the full label hierarchy on ServiceAccount, Role, RoleBinding, and Service
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 2
      - isKind:
          of: Service
        documentIndex: 3
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 3

  - it: should use release name as part-of even when release name differs from chart name
    release:
      name: my-release
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: my-release
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: my-release-operator
        documentIndex: 4
