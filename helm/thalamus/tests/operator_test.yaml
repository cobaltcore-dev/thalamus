suite: operator template

templates:
  - operator.yaml

release:
  name: thalamus
  namespace: thalamus

tests:
  - it: should carry the full label hierarchy on the Deployment
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: thalamus
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
        documentIndex: 4

  - it: should use selectorLabels (name + instance only) for matchLabels and pod template
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 4
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: thalamus
        documentIndex: 4
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
        documentIndex: 4
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: thalamus-operator
        documentIndex: 4

  - it: should carry the full label hierarchy on ServiceAccount, Role, RoleBinding, and Service
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 2
      - isKind:
          of: Service
        documentIndex: 3
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: operator
        documentIndex: 3

  - it: should use release name as part-of even when release name differs from chart name
    release:
      name: my-release
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: my-release
        documentIndex: 4
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: my-release-operator
        documentIndex: 4

  - it: should always enable leader election, even with a single replica
    set:
      operator.replicas: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 4
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=thalamus-operator
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-namespace=thalamus
        documentIndex: 4
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]
        documentIndex: 1
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [events]
            verbs: [create, patch]
        documentIndex: 1

  - it: should keep leader-election identity when replicas > 1
    set:
      operator.replicas: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=thalamus-operator
        documentIndex: 4
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-namespace=thalamus
        documentIndex: 4

  - it: should not grant rbac write or serviceaccount permissions
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [rbac.authorization.k8s.io]
            resources: [roles, rolebindings]
            verbs: [get, list, watch, create, update, patch, delete]
        documentIndex: 1
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: [services, serviceaccounts, configmaps]
            verbs: [get, list, watch, create, update, patch, delete]
        documentIndex: 1
