apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: {{ .Values.gateway.name }}
  listeners:
    {{- range $name, $listener := .Values.gateway.listeners }}
    {{- if ne $listener.enabled false }}
    - name: {{ $name }}
      {{- toYaml (omit $listener "enabled") | nindent 6 }}
    {{- end }}
    {{- end }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- toYaml .Values.gateway.parameters | nindent 2 }}
{{- range $name, $policy := .Values.gateway.policies }}
{{- if ne $policy.enabled false }}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  {{- $field := ternary "targetSelectors" "targetRefs" (hasKey $policy "targetSelectors") }}
  {{- $default := dict "group" "gateway.networking.k8s.io" "kind" "Gateway" }}
  {{- if eq $field "targetRefs" }}
  {{- $default = merge $default (dict "name" $.Values.gateway.name) }}
  {{- end }}
  {{- $targets := list }}
  {{- range (default (list dict) (index $policy $field)) }}
  {{- $targets = append $targets (merge (deepCopy .) $default) }}
  {{- end }}
  {{ $field }}:
    {{- toYaml $targets | nindent 4 }}
  {{- toYaml (omit $policy "enabled" "targetRefs" "targetSelectors") | nindent 2 }}
{{- end }}
{{- end }}
{{- $hasHTTPS := false }}
{{- range .Values.gateway.listeners }}
{{- if and (eq (.protocol | default "") "HTTPS") (ne .enabled false) }}{{ $hasHTTPS = true }}{{ end }}
{{- end }}
{{- $http := .Values.gateway.listeners.http }}
{{- if and $http (ne $http.enabled false) $hasHTTPS }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
