{{- if .Values.validation.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Name }}-model-argument-validation
  labels:
    {{- include "thalamus.labels" . | nindent 4 }}
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [thalamus.cloud]
        apiVersions: [v1alpha1]
        resources: [models]
        operations: [CREATE, UPDATE]
  validations:
    - expression: "!object.spec.serving.engine.containers.exists(c, c.name == 'engine' && has(c.args) && c.args.exists(a, a == '--host' || a.startsWith('--host=')))"
      message: "spec.serving.engine must not set --host (managed by the operator)"
    - expression: "!object.spec.serving.engine.containers.exists(c, c.name == 'engine' && has(c.args) && c.args.exists(a, a == '--port' || a.startsWith('--port=')))"
      message: "spec.serving.engine must not set --port (managed by the operator)"
    - expression: "!object.spec.serving.engine.containers.exists(c, c.name == 'engine' && has(c.args) && c.args.exists(a, a == '--served-model-name' || a.startsWith('--served-model-name=')))"
      message: "spec.serving.engine must not set --served-model-name (managed by the operator)"
    - expression: "!object.spec.serving.engine.containers.exists(c, c.name == 'engine' && has(c.env) && c.env.exists(e, e.name == 'VLLM_SKIP_MODEL_NAME_VALIDATION'))"
      message: "spec.serving.engine must not set VLLM_SKIP_MODEL_NAME_VALIDATION (managed by the operator)"
    - expression: "!has(object.spec.serving.engine.serviceAccountName)"
      message: "spec.serving.engine.serviceAccountName is managed by the operator"
    - expression: "!has(object.spec.serving.engine.automountServiceAccountToken)"
      message: "spec.serving.engine.automountServiceAccountToken is managed by the operator"
    - expression: "!has(object.spec.serving.router.serviceAccountName)"
      message: "spec.serving.router.serviceAccountName is managed by the operator"
    - expression: "!has(object.spec.serving.router.automountServiceAccountToken)"
      message: "spec.serving.router.automountServiceAccountToken is managed by the operator"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Name }}-model-argument-validation-binding
  labels:
    {{- include "thalamus.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Name }}-model-argument-validation
  matchResources:
    resourceRules:
      - apiGroups: [thalamus.cloud]
        apiVersions: [v1alpha1]
        resources: [models]
        operations: [CREATE, UPDATE]
  validationActions: [Deny]
{{- end }}
