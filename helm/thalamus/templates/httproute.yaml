apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-list
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/models
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-list
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: model-list
  traffic:
    directResponse:
      status: 200
      body: '{"object":"list","data":[]}'
    headerModifiers:
      response:
        set:
          - name: Content-Type
            value: application/json
