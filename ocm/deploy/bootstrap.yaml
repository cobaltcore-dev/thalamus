metadata:
  name: thalamus-rgd-component
  namespace: thalamus
spec:
  component: github.com/cobaltcore-dev/thalamus/thalamus
  repositoryRef:
    name: thalamus-repository
  semver: "0.1.0"
  interval: 1m
---
