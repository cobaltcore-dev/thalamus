apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: thalamus-open-webui
spec:
  schema:
    apiVersion: v1alpha1
    kind: ThalamusOpenWebui
    scope: Namespaced
    spec:
      version: string | default="15.2.0"
      prefix: string | default="thalamus-open-webui"
      myNamespace: string | default="open-webui"
      repository: object
      insecureRegistry: boolean | default=false
      openaiBaseApiUrl: string | default="http://inference-gateway.thalamus.svc.cluster.local/v1"
    status:
      ready: ${helmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
  resources:
    - id: myNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${schema.spec.myNamespace}

    - id: repository
      readyWhen:
        - ${repository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Repository
        metadata:
          name: ${schema.spec.prefix}-repository
          namespace: ${myNamespace.metadata.name}
        spec:
          repositorySpec: ${schema.spec.repository}
          interval: 10m

    - id: component
      readyWhen:
        - ${component.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Component
        metadata:
          name: ${schema.spec.prefix}-component
          namespace: ${myNamespace.metadata.name}
        spec:
          component: github.com/cobaltcore-dev/thalamus/open-webui
          repositoryRef:
            name: ${repository.metadata.name}
          semver: ${schema.spec.version}
          interval: 1m

    - id: chartResource
      readyWhen:
        - ${chartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-chart
          namespace: ${myNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              resource:
                name: open-webui-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: openWebuiImage
      readyWhen:
        - ${openWebuiImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-open-webui
          namespace: ${myNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              resource:
                name: open-webui-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: redisImage
      readyWhen:
        - ${redisImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-redis
          namespace: ${myNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              resource:
                name: redis-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: ociRepository
      readyWhen:
        - ${ociRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-repository
          namespace: ${myNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${chartResource.status.additional.oci.registry}/${chartResource.status.additional.oci.repository}
          ref:
            digest: ${chartResource.status.additional.oci.digest}

    - id: helmRelease
      readyWhen:
        - ${helmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: open-webui
          namespace: ${myNamespace.metadata.name}
        spec:
          releaseName: open-webui
          targetNamespace: ${myNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${ociRepository.metadata.name}
          values:
            image:
              repository: ${openWebuiImage.status.additional.oci.registry}/${openWebuiImage.status.additional.oci.repository}
              tag: 0.10.2@${openWebuiImage.status.additional.oci.digest}
            websocket:
              redis:
                image:
                  repository: ${redisImage.status.additional.oci.registry}/${redisImage.status.additional.oci.repository}
                  tag: 7.4.2-alpine3.21@${redisImage.status.additional.oci.digest}
            ollama:
              enabled: false
            pipelines:
              enabled: false
            tika:
              enabled: false
            terminals:
              enabled: false
            extraEnvVars:
              - name: WEBUI_AUTH
                value: "False"
            service:
              type: ClusterIP
            openaiBaseApiUrl: ${schema.spec.openaiBaseApiUrl}
            route:
              enabled: true
              parentRefs:
                - name: inference-gateway
                  namespace: thalamus
