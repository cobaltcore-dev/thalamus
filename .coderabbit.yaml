language: "en-US"
tone_instructions: "Be direct and specific. Flag potential issues even if minor. Do not soften feedback unnecessarily."

reviews:
  profile: "assertive"
  auto_review:
    enabled: true
    high_level_summary: true
    drafts: false
    auto_incremental_review: false
    ignore_title_keywords:
      - "renovate"
      - "bump"
      - "update"
    ignore_usernames:
      - "renovate[bot]"
      - "dependabot[bot]"

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!go.sum"
    - "!**/*.png"
    - "!**/*.gif"
    - "!**/*.mov"
    - "!website/.vitepress/dist/**"
