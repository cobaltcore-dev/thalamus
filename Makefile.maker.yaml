# Configuration file for <https://github.com/sapcc/go-makefile-maker>

metadata:
  url: https://github.com/cobaltcore-dev/thalamus

binaries:
  - name: operator
    fromPackage: ./cmd/operator
    installTo: bin/

controllerGen:
  enabled: false

shellCheck:
  ignorePaths:
    - website/node_modules

golang:
  setGoModVersion: true

golangciLint:
  createConfig: true

dockerfile:
  enabled: false

nix:
  enabled: false

githubWorkflow:
  ci:
    enabled: true
  securityChecks:
    enabled: true

renovate:
  enabled: true
  assignees:
    - Varsius
  packageRules:
    - matchPackageNames:
        - "agentgateway"
        - "agentgateway-crds"
      allowedVersions: "/^v1\\./"
  customManagers:
    - customType: regex
      fileMatch:
        - "^Makefile\\.maker\\.yaml$"
      matchStrings:
        - "CONTROLLER_TOOLS_VERSION\\s+\\?=\\s+(?<currentValue>v[\\d.]+)"
      depNameTemplate: "sigs.k8s.io/controller-tools"
      datasourceTemplate: "go"
    - customType: regex
      fileMatch:
        - "^Makefile\\.maker\\.yaml$"
      matchStrings:
        - "CRD_REF_DOCS_VERSION\\s+\\?=\\s+(?<currentValue>v[\\d.]+)"
      depNameTemplate: "github.com/elastic/crd-ref-docs"
      datasourceTemplate: "go"
    - customType: regex
      fileMatch:
        - "^Makefile\\.maker\\.yaml$"
      matchStrings:
        - "HELM_UNITTEST_VERSION\\s+\\?=\\s+(?<currentValue>v[\\d.]+)"
      depNameTemplate: "helm-unittest/helm-unittest"
      datasourceTemplate: "github-releases"

reuse:
  annotations:
    - paths:
        - '**'
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company and cobaltcore-dev contributors
      SPDX-License-Identifier: Apache-2.0

verbatim: |
  # Custom targets

  # renovate: datasource=go depName=sigs.k8s.io/controller-tools
  CONTROLLER_TOOLS_VERSION  ?= v0.21.0
  # renovate: datasource=go depName=github.com/elastic/crd-ref-docs
  CRD_REF_DOCS_VERSION      ?= v0.3.0
  # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
  HELM_UNITTEST_VERSION     ?= v1.1.2

  CONTROLLER_GEN = $(LOCALBIN)/controller-gen
  CRD_REF_DOCS   = $(LOCALBIN)/crd-ref-docs

  LOCALBIN ?= $(shell pwd)/bin
  $(LOCALBIN):
      mkdir -p $(LOCALBIN)

  # go-install-tool will 'go install' any package with custom target and name of binary, if it doesn't exist
  # $1 - target path with name of binary
  # $2 - package url which can be installed
  # $3 - specific version of package
  define go-install-tool
      @[ -f "$(1)-$(3)" ] || { \
          set -e; \
          package=$(2)@$(3) ;\
          echo "Downloading $${package}" ;\
          rm -f $(1) || true ;\
          GOBIN=$(LOCALBIN) go install $${package} ;\
          mv $(1) $(1)-$(3) ;\
      } ;\
      ln -sf $(1)-$(3) $(1)
  endef

  .PHONY: install-controller-gen
  install-controller-gen: $(LOCALBIN)
      $(call go-install-tool,$(CONTROLLER_GEN),sigs.k8s.io/controller-tools/cmd/controller-gen,$(CONTROLLER_TOOLS_VERSION))

  .PHONY: generate
  generate: crds deepcopy

  .PHONY: crds
  crds: install-controller-gen
      $(CONTROLLER_GEN) crd:allowDangerousTypes=true paths="./..." output:crd:artifacts:config=helm/thalamus-crds/templates

  .PHONY: deepcopy
  deepcopy: install-controller-gen
      $(CONTROLLER_GEN) object:headerFile="hack/boilerplate.go.txt" paths="./..."

  .PHONY: install-crd-ref-docs
  install-crd-ref-docs: $(LOCALBIN)
      $(call go-install-tool,$(CRD_REF_DOCS),github.com/elastic/crd-ref-docs,$(CRD_REF_DOCS_VERSION))

  .PHONY: docs
  docs: install-crd-ref-docs
      $(CRD_REF_DOCS) --renderer=markdown --source-path=api/v1alpha1 --config=hack/crd-ref-docs-config.yaml --output-path=/tmp/thalamus-crd-ref.md
      { printf -- '---\ntitle: Model CRD API Reference\noutline: deep\n---\n\n<!-- auto-generated by `make docs` — do not edit manually -->\n\n'; cat /tmp/thalamus-crd-ref.md; } > website/reference/model-crd-api.md

  .PHONY: test
  test: build/cover.out helm-unittest

  .PHONY: helm-unittest
  helm-unittest:
      @set -e; \
      if ! helm plugin list | grep -q "^unittest"; then \
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version $(HELM_UNITTEST_VERSION) --verify=false; \
      fi
      helm unittest helm/thalamus

  .PHONY: all
  all: generate test docs build-all static-check

  .DEFAULT_GOAL := all

