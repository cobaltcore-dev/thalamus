apiVersion: batch/v1
kind: Job
metadata:
  name: modelpack-downloader
spec:
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
        - name: qwen2-modelpack-downloader
          image: modctl:latest
          imagePullPolicy: Never
          env:
            - name: "USER"
              value: "1000"
            - name: "HOME"
              value: "/models/.home"
          command:
            - "modctl"
            - "fetch"
            - "--storage-dir"
            - "/models/.modctl"
            - "--output"
            - "/models/base"
            - "ghcr.io/modelpack/trl-internal-testing-tiny-qwen2forcausallm-2.5:latest"
            - "--patterns"
            - "*"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: qwen2
      restartPolicy: Never
  backoffLimit: 4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi
