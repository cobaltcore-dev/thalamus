# Sample per-cluster instance. Every supported knob is declared in the
# RGD schema; this is the entire configuration surface.
apiVersion: kro.run/v1alpha1
kind: Thalamus
metadata:
  name: thalamus
  namespace: thalamus
spec:
  version: "0.1.0"
  prefix: thalamus
  repository:
    baseUrl: ghcr.io/skarlso/thalamus-transferred
    type: OCIRegistry
  insecureRegistry: false
  nodeFeatureDiscovery:
    enabled: true
  gpuOperator:
    enabled: true
  kubePrometheusStack:
    enabled: true
  agentgateway:
    enabled: true
  externalDns:
    enabled: false
  openWebui:
    enabled: true
