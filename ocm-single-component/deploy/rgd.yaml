# Single-RGD variant: one component, one graph. All configurability is
# declared in this schema; nothing is exchanged at the component level.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: thalamus
spec:
  schema:
    apiVersion: v1alpha1
    kind: Thalamus
    scope: Namespaced
    spec:
      version: string | default="0.1.0"
      prefix: string | default="thalamus"
      repository: object
      insecureRegistry: boolean | default=false
      nodeFeatureDiscovery:
        enabled: boolean | default=true
      gpuOperator:
        enabled: boolean | default=true
      kubePrometheusStack:
        enabled: boolean | default=true
      agentgateway:
        enabled: boolean | default=true
      externalDns:
        enabled: boolean | default=false
      openWebui:
        enabled: boolean | default=true
        openaiBaseApiUrl: string | default="http://inference-gateway.thalamus.svc.cluster.local/v1"
    status:
      ready: ${thalamusHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
  resources:
    # ==========================================================
    # Bootstrap (self managed) configuration
    # ==========================================================
    - id: thalamusNamespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: thalamus

    - id: repository
      readyWhen:
        - ${repository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Repository
        metadata:
          name: ${schema.spec.prefix}-repository
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          repositorySpec: ${schema.spec.repository}
          interval: 10m

    - id: component
      readyWhen:
        - ${component.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Component
        metadata:
          name: ${schema.spec.prefix}-component
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          component: github.com/cobaltcore-dev/thalamus
          repositoryRef:
            name: ${repository.metadata.name}
          semver: ${schema.spec.version}
          interval: 1m

    - id: rgdResource
      readyWhen:
        - ${rgdResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-rgd
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              resource:
                name: thalamus-rgd

    - id: rgdDeployer
      readyWhen:
        - ${rgdDeployer.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Deployer
        metadata:
          name: ${schema.spec.prefix}-deployer
        spec:
          resourceRef:
            name: ${rgdResource.metadata.name}
            namespace: ${thalamusNamespace.metadata.name}

    # ==========================================================
    # Namespaces
    # ==========================================================
    - id: nfdNamespace
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: node-feature-discovery

    - id: gpuOperatorNamespace
      includeWhen:
        - ${schema.spec.gpuOperator.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: gpu-operator

    - id: monitoringNamespace
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: monitoring

    - id: agentgatewayNamespace
      includeWhen:
        - ${schema.spec.agentgateway.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: agentgateway-system

    - id: externalDnsNamespace
      includeWhen:
        - ${schema.spec.externalDns.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: external-dns

    - id: openWebuiNamespace
      includeWhen:
        - ${schema.spec.openWebui.enabled}
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: open-webui

    # ==========================================================
    # gateway-api-crds
    # ==========================================================
    - id: gatewayApiCrdsChartResource
      readyWhen:
        - ${gatewayApiCrdsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gateway-api-crds
              resource:
                name: gateway-api-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gatewayApiCrdsOciRepository
      readyWhen:
        - ${gatewayApiCrdsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gatewayApiCrdsChartResource.status.additional.oci.registry}/${gatewayApiCrdsChartResource.status.additional.oci.repository}
          ref:
            digest: ${gatewayApiCrdsChartResource.status.additional.oci.digest}

    - id: gatewayApiCrdsHelmRelease
      readyWhen:
        - ${gatewayApiCrdsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gateway-api-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gateway-api-crds
          targetNamespace: default
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${gatewayApiCrdsOciRepository.metadata.name}

    # ==========================================================
    # gateway-api-inference-extension-crds
    # ==========================================================
    - id: gatewayApiInfExtCrdsChartResource
      readyWhen:
        - ${gatewayApiInfExtCrdsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gateway-api-inference-extension-crds
              resource:
                name: gateway-api-inference-extension-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gatewayApiInfExtCrdsOciRepository
      readyWhen:
        - ${gatewayApiInfExtCrdsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gatewayApiInfExtCrdsChartResource.status.additional.oci.registry}/${gatewayApiInfExtCrdsChartResource.status.additional.oci.repository}
          ref:
            digest: ${gatewayApiInfExtCrdsChartResource.status.additional.oci.digest}

    - id: gatewayApiInfExtCrdsHelmRelease
      readyWhen:
        - ${gatewayApiInfExtCrdsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gateway-api-inference-extension-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gateway-api-inference-extension-crds
          targetNamespace: default
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${gatewayApiInfExtCrdsOciRepository.metadata.name}

    # ==========================================================
    # node-feature-discovery
    # ==========================================================
    - id: nfdChartResource
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: node-feature-discovery
              resource:
                name: node-feature-discovery-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: nfdImage
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: node-feature-discovery
              resource:
                name: node-feature-discovery-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: nfdOciRepository
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${nfdChartResource.status.additional.oci.registry}/${nfdChartResource.status.additional.oci.repository}
          ref:
            digest: ${nfdChartResource.status.additional.oci.digest}

    - id: nfdHelmRelease
      includeWhen:
        - ${schema.spec.nodeFeatureDiscovery.enabled}
      readyWhen:
        - ${nfdHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: node-feature-discovery
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: node-feature-discovery
          targetNamespace: ${nfdNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${nfdOciRepository.metadata.name}
          values:
            image:
              repository: ${nfdImage.status.additional.oci.registry}/${nfdImage.status.additional.oci.repository}
              tag: v0.19.0@${nfdImage.status.additional.oci.digest}

    # ==========================================================
    # gpu-operator
    # ==========================================================
    - id: gpuOperatorChartResource
      includeWhen:
        - ${schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: gpu-operator
              resource:
                name: gpu-operator-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: gpuOperatorOciRepository
      includeWhen:
        - ${schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${gpuOperatorChartResource.status.additional.oci.registry}/${gpuOperatorChartResource.status.additional.oci.repository}
          ref:
            digest: ${gpuOperatorChartResource.status.additional.oci.digest}

    - id: gpuOperatorHelmRelease
      includeWhen:
        - ${schema.spec.gpuOperator.enabled}
      readyWhen:
        - ${gpuOperatorHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: gpu-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: gpu-operator
          targetNamespace: ${gpuOperatorNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          dependsOn:
            - name: ${nfdHelmRelease.metadata.name}
          chartRef:
            kind: OCIRepository
            name: ${gpuOperatorOciRepository.metadata.name}
          values:
            nfd:
              enabled: false

    # ==========================================================
    # kube-prometheus-stack
    # ==========================================================
    - id: kpsChartResource
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: kube-prometheus-stack-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsPrometheusOperatorImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsPrometheusOperatorImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-prometheus-operator
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: prometheus-operator-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsConfigReloaderImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsConfigReloaderImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-config-reloader
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: config-reloader-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsThanosImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsThanosImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-thanos
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: thanos-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsPrometheusImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsPrometheusImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-prometheus
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: prometheus-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsAlertmanagerImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsAlertmanagerImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-alertmanager
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: alertmanager-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsWebhookCertgenImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsWebhookCertgenImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-webhook-certgen
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: webhook-certgen-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsKubeStateMetricsImage
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsKubeStateMetricsImage.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-image-kube-state-metrics
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: kube-prometheus-stack
              resource:
                name: kube-state-metrics-image
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: kpsOciRepository
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${kpsChartResource.status.additional.oci.registry}/${kpsChartResource.status.additional.oci.repository}
          ref:
            digest: ${kpsChartResource.status.additional.oci.digest}

    - id: kpsHelmRelease
      includeWhen:
        - ${schema.spec.kubePrometheusStack.enabled}
      readyWhen:
        - ${kpsHelmRelease.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: kube-prometheus-stack
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          releaseName: kube-prometheus-stack
          targetNamespace: ${monitoringNamespace.metadata.name}
          interval: 1m
          timeout: 5m
          chartRef:
            kind: OCIRepository
            name: ${kpsOciRepository.metadata.name}
          values:
            nodeExporter:
              enabled: false
            grafana:
              enabled: false
            prometheusOperator:
              image:
                registry: ${kpsPrometheusOperatorImage.status.additional.oci.registry}
                repository: ${kpsPrometheusOperatorImage.status.additional.oci.repository}
                tag: v0.92.1@${kpsPrometheusOperatorImage.status.additional.oci.digest}
              prometheusConfigReloader:
                image:
                  registry: ${kpsConfigReloaderImage.status.additional.oci.registry}
                  repository: ${kpsConfigReloaderImage.status.additional.oci.repository}
                  tag: v0.92.1@${kpsConfigReloaderImage.status.additional.oci.digest}
              thanosImage:
                registry: ${kpsThanosImage.status.additional.oci.registry}
                repository: ${kpsThanosImage.status.additional.oci.repository}
                tag: v0.42.0@${kpsThanosImage.status.additional.oci.digest}
              admissionWebhooks:
                patch:
                  image:
                    registry: ${kpsWebhookCertgenImage.status.additional.oci.registry}
                    repository: ${kpsWebhookCertgenImage.status.additional.oci.repository}
                    tag: 1.8.4@${kpsWebhookCertgenImage.status.additional.oci.digest}
            prometheus:
              prometheusSpec:
                image:
                  registry: ${kpsPrometheusImage.status.additional.oci.registry}
                  repository: ${kpsPrometheusImage.status.additional.oci.repository}
                  tag: v3.13.1-distroless@${kpsPrometheusImage.status.additional.oci.digest}
            alertmanager:
              alertmanagerSpec:
                image:
                  registry: ${kpsAlertmanagerImage.status.additional.oci.registry}
                  repository: ${kpsAlertmanagerImage.status.additional.oci.repository}
                  tag: v0.33.1@${kpsAlertmanagerImage.status.additional.oci.digest}
            kube-state-metrics:
              image:
                registry: ${kpsKubeStateMetricsImage.status.additional.oci.registry}
                repository: ${kpsKubeStateMetricsImage.status.additional.oci.repository}
                tag: v2.19.1@${kpsKubeStateMetricsImage.status.additional.oci.digest}

    # ==========================================================
    # agentgateway-crds
    # ==========================================================
    - id: agentgatewayCrdsChartResource
      includeWhen:
        - ${schema.spec.agentgateway.enabled}
      readyWhen:
        - ${agentgatewayCrdsChartResource.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: delivery.ocm.software/v1alpha1
        kind: Resource
        metadata:
          name: ${schema.spec.prefix}-resource-agentgateway-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          componentRef:
            name: ${component.metadata.name}
          resource:
            byReference:
              referencePath:
                - name: agentgateway-crds
              resource:
                name: agentgateway-crds-chart
          additionalStatusFields:
            oci: resource.access.toOCI()

    - id: agentgatewayCrdsOciRepository
      includeWhen:
        - ${schema.spec.agentgateway.enabled}
      readyWhen:
        - ${agentgatewayCrdsOciRepository.status.conditions.exists(c, c.type == "Ready" && c.status == "True")}
      template:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
        metadata:
          name: ${schema.spec.prefix}-oci-agentgateway-crds
          namespace: ${thalamusNamespace.metadata.name}
        spec:
          interval: 1m0s
          insecure: ${schema.spec.insecureRegistry}
          layerSelector:
            mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            operation: copy
          url: oci://${agentgatewayCrdsChartResource.status.additional.oci.registry}/${agentgatewayCrdsChartResource.status.additional.oci.repository}
          ref:
