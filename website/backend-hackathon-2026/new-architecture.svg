<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="660" viewBox="0 0 820 660" version="1.1"
     style="background: transparent; color-scheme: light dark;" font-family="Helvetica, Arial, sans-serif">
  <style>
    .label  { font-size: 13px; fill: #000000; }
    .labelw { font-size: 13px; fill: light-dark(#000000, #ffffff); font-weight: bold; }
    .sub    { font-size: 11px; fill: #333333; }
    .subw   { font-size: 11px; fill: light-dark(#444444, #bbbbbb); }
    .edge   { stroke: light-dark(#000000, #ffffff); stroke-width: 1.5; fill: none; }
    .edged  { stroke: light-dark(#666666, #aaaaaa); stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    .boundary { stroke: light-dark(#000000, #ffffff); stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    .elabel { font-size: 11px; fill: light-dark(#000000, #ffffff); }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="light-dark(#000000, #ffffff)"/>
    </marker>
    <marker id="arrow2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="light-dark(#666666, #aaaaaa)"/>
    </marker>
  </defs>

  <!-- Author / client -->
  <rect x="40" y="40" width="160" height="50" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="120" y="62" text-anchor="middle" class="label">Model maintainer</text>
  <text x="120" y="79" text-anchor="middle" class="sub">applies a Model + Provider</text>

  <!-- ===== Central API / in-tree ===== -->
  <rect x="300" y="30" width="480" height="230" class="boundary"/>
  <text x="540" y="52" text-anchor="middle" class="labelw">Central API &amp; controller · thalamus-ai/thalamus (in-tree)</text>

  <!-- Model CRD -->
  <rect x="325" y="72" width="190" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="420" y="94" text-anchor="middle" class="label">Model</text>
  <text x="420" y="111" text-anchor="middle" class="sub">weights, engine, replicas, providerRef</text>

  <!-- Provider CRD -->
  <rect x="560" y="72" width="190" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="655" y="94" text-anchor="middle" class="label">Provider</text>
  <text x="655" y="111" text-anchor="middle" class="sub">providerID: native | dynamo | ...</text>

  <!-- central controller -->
  <rect x="380" y="170" width="320" height="64" rx="9" fill="#fff2cc" stroke="#d6b656"/>
  <text x="540" y="195" text-anchor="middle" class="label">Central controller</text>
  <text x="540" y="213" text-anchor="middle" class="sub">configures agentgateway for ready models;</text>
  <text x="540" y="227" text-anchor="middle" class="sub">common lifecycle &amp; status aggregation</text>

  <!-- Model -> providerRef -> Provider -->
  <path class="edge" d="M 515 100 L 560 100" marker-end="url(#arrow2)"/>
  <text x="537" y="90" text-anchor="middle" class="elabel">ref</text>

  <!-- Maintainer -> central API -->
  <path class="edge" d="M 200 65 L 325 92" marker-end="url(#arrow2)"/>

  <!-- central controller -> gateway (down to data plane, dashed) -->
  <!-- Model -> central controller -->
  <path class="edged" d="M 420 128 L 440 170" marker-end="url(#arrow2d)"/>

  <!-- ===== Out-of-tree provider ===== -->
  <rect x="120" y="320" width="580" height="160" class="boundary"/>
  <text x="410" y="342" text-anchor="middle" class="labelw">Provider controller · e.g. thalamus-ai/native (out-of-tree)</text>

  <!-- watches/filter -->
  <rect x="150" y="360" width="230" height="56" rx="9" fill="#d5e8d4" stroke="#82b366"/>
  <text x="265" y="382" text-anchor="middle" class="label">watch Models, match Provider</text>
  <text x="265" y="399" text-anchor="middle" class="sub">reconcile only matching providerID</text>

  <!-- translate -->
  <rect x="430" y="360" width="240" height="56" rx="9" fill="#d5e8d4" stroke="#82b366"/>
  <text x="550" y="382" text-anchor="middle" class="label">translate → backend-internal CR</text>
  <text x="550" y="399" text-anchor="middle" class="sub">own CRD / vendor API</text>

  <path class="edge" d="M 380 388 L 430 388" marker-end="url(#arrow2)"/>

  <!-- Model -> provider controller -->
  <path class="edge" d="M 400 128 C 250 180, 180 280, 230 360" marker-end="url(#arrow2)"/>
  <text x="170" y="250" text-anchor="middle" class="elabel">watch</text>

  <!-- ===== Backend runtime ===== -->
  <rect x="300" y="520" width="360" height="110" rx="9" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="480" y="548" text-anchor="middle" class="label">Backend runtime</text>
  <text x="480" y="568" text-anchor="middle" class="sub">native: vLLM engine Deployment + Service</text>
  <text x="480" y="585" text-anchor="middle" class="sub">dynamo / aim / kserve: vendor-managed pods</text>
  <text x="480" y="608" text-anchor="middle" class="sub">status &amp; serviceRef reported back on the Model</text>

  <!-- translate -> runtime -->
  <path class="edge" d="M 550 416 L 500 520" marker-end="url(#arrow2)"/>

  <!-- runtime status back to central controller (dashed, long) -->
  <path class="edged" d="M 660 560 C 760 480, 760 300, 700 215" marker-end="url(#arrow2d)"/>
  <text x="760" y="400" text-anchor="middle" class="subw">status</text>

  <!-- Gateway data plane -->
  <rect x="40" y="520" width="200" height="60" rx="10" fill="#f5f5f5" stroke="#666666"/>
  <text x="140" y="545" text-anchor="middle" class="label" fill="#000000">agentgateway</text>
  <text x="140" y="563" text-anchor="middle" class="sub">shared OpenAI endpoint</text>

  <!-- central controller -> gateway -->
  <path class="edged" d="M 380 210 C 180 250, 120 420, 130 520" marker-end="url(#arrow2d)"/>
  <text x="120" y="360" text-anchor="middle" class="subw">configure routes</text>

  <!-- gateway -> runtime -->
  <path class="edge" d="M 240 555 C 280 560, 290 560, 300 560" marker-end="url(#arrow2)"/>
</svg>
