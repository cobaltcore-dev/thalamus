# Deliberately non-compliant fixture for the Model contract-validation e2e step:
# spec.serving.engine.args sets --port, which the operator manages itself.
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: forbidden-flags
  namespace: thalamus
spec:
  backend: native
  serving:
    engine:
      containers:
        - name: engine
          image: docker.io/vllm/vllm-openai:v0.27.0
          args:
            - --port=8000
    router:
      containers:
        - name: router
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
  weights:
    type: hf
    hf:
      repoId: HuggingFaceTB/SmolLM2-135M-Instruct
