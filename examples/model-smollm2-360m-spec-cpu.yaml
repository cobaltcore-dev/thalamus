# A small CPU-suitable Model with draft-model speculative decoding,
# for local development and the E2E validation suite.
---
apiVersion: thalamus.cloud/v1alpha1
kind: ModelArtifact
metadata:
  name: smollm2-360m-spec
  namespace: thalamus
spec:
  base: hf://HuggingFaceTB/SmolLM2-360M-Instruct
  draft: hf://HuggingFaceTB/SmolLM2-135M-Instruct
---
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: smollm2-360m-spec
  namespace: thalamus
spec:
  replicas: 1
  artifactRef:
    name: smollm2-360m-spec
  serving:
    engine:
      containers:
        - name: engine
          image: docker.io/vllm/vllm-openai-cpu:v0.33.0
          args:
            - --dtype=float32
            - --spec-tokens=4
            - --max-model-len=512
            - --max-num-seqs=1
            - --enforce-eager
            - --enable-auto-tool-choice
            - --tool-call-parser=apertus
            - --override-generation-config={"temperature":0}
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
    router:
      containers:
        - name: router
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
