# A small CPU-suitable Model using a PVC prefilled by the artifact download Job.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-data
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: ""
  hostPath:
    path: /var/local/thalamus-model-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-data
  namespace: thalamus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
  volumeName: model-data
---
apiVersion: thalamus.cloud/v1alpha1
kind: ModelArtifact
metadata:
  name: smollm2-135m-prefetch
  namespace: thalamus
spec:
  base: hf://HuggingFaceTB/SmolLM2-135M-Instruct
  volume:
    claimName: model-data
---
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: smollm2-135m-prefetch
  namespace: thalamus
spec:
  artifactRef:
    name: smollm2-135m-prefetch
  serving:
    engine:
      containers:
        - name: engine
          image: docker.io/vllm/vllm-openai-cpu:v0.27.0
          args:
            - --max-model-len=512
            - --max-num-seqs=1
            - --enforce-eager
            - --enable-auto-tool-choice
            - --tool-call-parser=apertus
            - --override-generation-config={"temperature":0}
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              cpu: 4000m
              memory: 6Gi
    router:
      containers:
        - name: router
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
