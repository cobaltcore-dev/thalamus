# Model B: prefetched into a PVC.
# The download Job fills the PVC before the Model is deployed, so the engine
# starts from local weights instead of fetching them.
#
# Demo order: apply the PersistentVolumeClaim and the ModelArtifact first
# (the download Job starts, the artifact becomes Ready), then apply the Model.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-5-0-8b
  namespace: thalamus
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: csi-manila-nfs-eu-de-2b
---
apiVersion: thalamus.cloud/v1alpha1
kind: ModelArtifact
metadata:
  name: qwen25-0-5b-modelpack
  namespace: thalamus
spec:
  base: modelpack://ghcr.io/modelpack/qwen-qwen2.5-0.5b-instruct:latest
  volume:
    claimName: qwen3-5-0-8b
---
apiVersion: thalamus.cloud/v1alpha1
kind: Model
metadata:
  name: qwen25-0-5b-modelpack
  namespace: thalamus
spec:
  replicas: 1
  aliases:
    - qwen2.5-0.5b
  artifactRef:
    name: qwen25-0-5b-modelpack
  serving:
    engine:
      containers:
        - name: engine
          image: docker.io/vllm/vllm-openai-cpu:v0.27.0
          args:
            - --max-model-len=512
            - --max-num-seqs=1
            - --enforce-eager
            - --override-generation-config={"temperature":0}
          env:
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            - name: VLLM_CPU_OMP_THREADS_BIND
              value: nobind
          resources:
            requests:
              cpu: 2000m
              memory: 6Gi
            limits:
              cpu: 4000m
              memory: 6Gi
    router:
      containers:
        - name: router
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi